name: dad_app
description: "Drink and Drive (DAD) - Safe ride home service"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  google_sign_in: ^6.2.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

# ------------------------------------------------------------
# App launcher icon generation (Android + iOS)
# ------------------------------------------------------------
# Drop a 1024x1024 PNG at assets/icon/app_icon.png, then run:
#   dart run flutter_launcher_icons
# This regenerates the Android mipmap + iOS AppIcon assets.
# ------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21